name: Build DeviceChanger Deb
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos (Tự động tải Toolchain)
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/theos/theos.git
          
      - name: Install SDK, ldid & Build
        run: |
          export THEOS=$HOME/theos
          sudo apt-get update
          sudo apt-get install -y curl xz-utils fakeroot dpkg
          
          # Tải trực tiếp ldid
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid
          sudo mv ldid /usr/local/bin/
          
          # Xóa thư mục rỗng và tải SDK thật
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          
          # Fix lỗi Git
          git config --global --add safe.directory '*'
          
          # Build ra file Deb
          make clean || true
          make package FINALPACKAGE=1
          
      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: DeviceChanger-Deb
          path: ./packages/*.deb
