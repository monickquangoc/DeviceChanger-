name: Build DeviceChanger Deb
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl fakeroot dpkg
          
          # Tải trực tiếp ldid bản Linux, bỏ qua kho của Ubuntu
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid
          sudo mv ldid /usr/local/bin/

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Download SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Fix Permissions
        run: git config --global --add safe.directory '*'

      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: DeviceChanger-Deb
          path: ./packages/*.deb
